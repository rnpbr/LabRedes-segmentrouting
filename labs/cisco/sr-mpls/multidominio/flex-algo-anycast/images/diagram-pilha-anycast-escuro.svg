<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900" role="img" aria-labelledby="titulo descricao" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
<title id="titulo">Pilha de labels da SR Policy color 128, salto a salto</title>
<desc id="descricao">Em cima, o caso normal: PE1 impõe 17120, 17230 e 17309; P1 remove 17120 por PHP, DBR-AB1 remove 17230 por PHP, DBR-BC1 encaminha 17309 e P3 o remove antes de PE9. Embaixo, o caso maligno: DBR-AB1 perdeu o domínio B, ainda atrai o anycast AB e descarta o pacote porque não tem entrada para 17230.</desc>
