<text x="80" y="846" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9db4be">O anycast prova alcance da borda dentro do domínio local, não a capacidade de seguir para o próximo.</text>
