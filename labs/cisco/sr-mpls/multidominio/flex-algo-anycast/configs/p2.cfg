!
hostname p2
!
username clab
 group root-lr
 group cisco-support
 secret clab@123
!
line default
 transport input ssh
!
netconf-yang agent
 ssh
!
interface MgmtEth0/RP0/CPU0/0
!
interface Loopback0
 ipv4 address 10.1.255.3 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description p2-to-pe1 domain-a red-low-cost
 ipv4 address 10.1.0.3 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description p2-to-p1 domain-a normal
 ipv4 address 10.1.0.5 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description p2-to-dbr-ab2 domain-a normal
 ipv4 address 10.1.0.8 255.255.255.254
 no shutdown
!
router ospf 100
 router-id 1.1.1.3
 affinity-map
  red bit-position 10
 !
 segment-routing mpls
 segment-routing sr-prefer
 area 0
  segment-routing mpls
  interface Loopback0
   passive enable
   prefix-sid index 103
   prefix-sid algorithm 128 index 1103
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 5
   affinity flex-algo
    red
   !
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  !
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  !
 !
 flex-algo 128
  priority 200
  advertise-definition
  affinity exclude-any
   red
  !
 !
!
segment-routing
 global-block 16000 23999
mpls oam
!
ssh server v2
ssh server netconf
end
