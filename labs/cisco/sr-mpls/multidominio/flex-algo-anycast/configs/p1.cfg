!
hostname p1
!
username clab
 group root-lr
 group cisco-support
 secret clab@123
!
line default
 transport input ssh
!
netconf-yang agent
 ssh
!
interface MgmtEth0/RP0/CPU0/0
!
interface Loopback0
 ipv4 address 10.1.255.2 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description p1-to-pe1 domain-a normal
 ipv4 address 10.1.0.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description p1-to-p2 domain-a normal
 ipv4 address 10.1.0.4 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description p1-to-dbr-ab1 domain-a normal
 ipv4 address 10.1.0.6 255.255.255.254
 no shutdown
!
router ospf 100
 router-id 1.1.1.2
 affinity-map
  red bit-position 10
 !
 segment-routing mpls
 segment-routing sr-prefer
 area 0
  segment-routing mpls
  interface Loopback0
   passive enable
   prefix-sid index 102
   prefix-sid algorithm 128 index 1102
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  !
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  !
 !
 flex-algo 128
  priority 200
  advertise-definition
  affinity exclude-any
   red
  !
 !
!
segment-routing
 global-block 16000 23999
mpls oam
!
ssh server v2
ssh server netconf
end
