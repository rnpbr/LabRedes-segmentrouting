<text x="762" y="384" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#55707c">encaminhamento real: XRd é control plane</text>
<line x1="57" y1="490" x2="1183" y2="490" stroke="#e4edf0" stroke-width="1" stroke-linecap="butt"/>
<text x="57" y="516" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#55707c">Neste losango o vizinho do outro ramo já satisfaz a condição de LFA: ver Backup (Local-LFA) com TI-LFA habilitado é o resultado correto, não uma falha do recurso.</text>
<text x="57" y="533" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#55707c">Uma repair list com vários segmentos exigiria uma topologia em que nenhum LFA local atenda.</text>
