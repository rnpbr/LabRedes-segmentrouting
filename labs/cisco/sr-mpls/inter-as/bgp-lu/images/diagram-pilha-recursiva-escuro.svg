<title id="titulo">Recursão de transporte: a pilha de labels salto a salto</title>
<desc id="descricao">No PE de ingresso, a rota BGP labeled-unicast para 10.0.0.8/32 recursa sobre o Prefix-SID do ASBR e produz a pilha {16004, 16008}; ao longo do caminho a pilha é reduzida por PHP, atravessa a fronteira e continua como Prefix-SID no backbone.</desc>
