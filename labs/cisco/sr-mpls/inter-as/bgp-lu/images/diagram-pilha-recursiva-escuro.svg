<text x="57" y="582" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9db4be">Valide a relação entre rota LU, next hop e Prefix-SID na mesma execução. Nesta captura, o label LU 16008 coincide com o Prefix-SID indexado do PE remoto; os contextos de entrada e saída continuam sendo locais.</text>
<text x="57" y="599" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9db4be">As LFIB de p-pop-a e p-ipe-rn não foram capturadas; o pop por PHP é o comportamento observado nos vizinhos e está marcado como esperado, não como evidência.</text>
<text x="57" y="616" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#9db4be">Se pe-ipe-ce anunciar implicit-null para a própria loopback, o label BGP desaparece antes de 16008 e a pilha do backbone tem um único elemento.</text>
