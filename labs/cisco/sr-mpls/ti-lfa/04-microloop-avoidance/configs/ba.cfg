!
! ============================================================================
! Bloco base do containerlab para o kind cisco_xrd.
! Espelha nodes/xrd/xrd.cfg do containerlab: sem ele o no sobe sem hostname,
! sem usuario clab, sem SSH e sem rota default de gerencia.
! Nao editar: as variaveis {{ .ShortName }} e {{ .MgmtIPv4Gateway }} sao
! resolvidas pelo containerlab em tempo de deploy.
! ============================================================================
!
hostname {{ .ShortName }}
!
username clab
 group root-lr
 group cisco-support
 secret clab@123
!
grpc
 port 9339
 no-tls
 address-family dual
!
line default
 transport input ssh
!
netconf-yang agent
 ssh
!
interface MgmtEth0/RP0/CPU0/0
!
ssh server v2
ssh server netconf
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 MgmtEth0/RP0/CPU0/0 {{ .MgmtIPv4Gateway }}
 !
!
!
! ==========================================================================
! Lab TI-LFA / SR Microloop Avoidance - Rede Ipe / no BA
! Papel: ancora da SID-list (prefix-SID 16007) e dono do Adj-SID BA->DF
! ==========================================================================
!
! Endereco de origem da SR-TE policy que o IGP instancia sozinho para
! programar o caminho microloop-avoidant. Sem esta linha o caminho
! microloop-avoidant nao chega a ser instalado em parte das imagens IOS-XR.
ipv4 unnumbered mpls traffic-eng Loopback0
!
interface Loopback0
 ipv4 address 10.0.1.248 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description LINK-BA-DF (ultimo salto do arco longo, custo 100)
 ipv4 address 10.10.27.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description LINK-BA-MG (arco longo)
 ipv4 address 10.10.57.2 255.255.255.252
 no shutdown
!
segment-routing
 global-block 16000 23999
!
router ospf 1
 router-id 10.0.1.248
 segment-routing mpls
 segment-routing forwarding mpls
 microloop avoidance segment-routing
 microloop avoidance rib-update-delay 60000
 area 0
  interface Loopback0
   passive enable
   prefix-sid index 7
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 100
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
  !
 !
!
!
end
