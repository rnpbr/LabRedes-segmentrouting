# TI-LFA Node + SRLG Protection
#
# Deploy:
#   sudo clab deploy -t lab.clab.yml
#
# Cada no le seu arquivo de configuracao em configs/<no>.cfg, ao lado deste
# arquivo. O containerlab entrega o .cfg ao XRd como first-boot.cfg.
#
# Repositorio: https://github.com/rnpbr/LabRedes-segmentrouting.git
#
# Para servir os .cfg direto do GitHub em vez de copiar configs/ para o disco,
# troque o caminho de cada no por uma URL raw:
#   startup-config: https://raw.githubusercontent.com/rnpbr/LabRedes-segmentrouting/main/labs/cisco/sr-mpls/ti-lfa/03-node-srlg-protection/configs/sp.cfg
# Ref: https://containerlab.dev/manual/config-mgmt/#remote
#
# enforce-startup-config faz todo deploy reaplicar o .cfg, em vez de reusar a
# config gravada por uma execucao anterior.

name: tilfa-node-srlg-protection

mgmt:
  network: tilfa-node-srlg-mgmt
  ipv4-subnet: 172.20.24.0/24

topology:
  defaults:
    kind: cisco_xrd

  kinds:
    cisco_xrd:
      image: ios-xr/xrd-control-plane:7.10.2
      enforce-startup-config: true
      # para habilitar, o caminho do startup-config deve ser válido. Avaliando import de configs via URL, mas ainda nao definido.

  nodes:
    sp:
      mgmt-ipv4: 172.20.24.11
      startup-config: configs/sp.cfg
    df:
      mgmt-ipv4: 172.20.24.12
      startup-config: configs/df.cfg
    rj:
      mgmt-ipv4: 172.20.24.13
      startup-config: configs/rj.cfg
    mg:
      mgmt-ipv4: 172.20.24.15
      startup-config: configs/mg.cfg
    pr:
      mgmt-ipv4: 172.20.24.16
      startup-config: configs/pr.cfg
    ba:
      mgmt-ipv4: 172.20.24.17
      startup-config: configs/ba.cfg

  links:
    # SP-MG: enlace/no protegido, custo 10, SRLG ipe-mg-duct
    - endpoints: ["sp:Gi0-0-0-1", "mg:Gi0-0-0-0"]
    # MG-BA: cadeia primaria, custo 10
    - endpoints: ["mg:Gi0-0-0-3", "ba:Gi0-0-0-1"]
    # BA-DF: cadeia primaria, custo 10
    - endpoints: ["ba:Gi0-0-0-0", "df:Gi0-0-0-0"]
    # SP-RJ: ponte alta, custo 10
    - endpoints: ["sp:Gi0-0-0-0", "rj:Gi0-0-0-0"]
    # RJ-PR: ponte alta, custo 100
    - endpoints: ["rj:Gi0-0-0-2", "pr:Gi0-0-0-0"]
    # PR-MG: contorna o enlace, custo 100
    - endpoints: ["pr:Gi0-0-0-1", "mg:Gi0-0-0-2"]
    # PR-BA: contorna o no MG inteiro, custo 100 - backup node-protecting
    - endpoints: ["pr:Gi0-0-0-2", "ba:Gi0-0-0-2"]
    # RJ-MG: atalho custo 15, mesma canaleta de SP-MG (SRLG ipe-mg-duct)
    - endpoints: ["rj:Gi0-0-0-1", "mg:Gi0-0-0-1"]
