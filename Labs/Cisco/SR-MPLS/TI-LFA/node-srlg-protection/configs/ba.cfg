conf t
interface Loopback0
 ipv4 address 10.0.1.248 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description LINK-BA-DF
 ipv4 address 10.10.27.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description LINK-BA-MG
 ipv4 address 10.10.57.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description LINK-BA-PR
 ipv4 address 10.10.67.2 255.255.255.252
 no shutdown
!
segment-routing
 global-block 16000 23999
!
router ospf 1
 router-id 10.0.1.248
 segment-routing mpls
 segment-routing forwarding mpls
 area 0
  interface Loopback0
   passive enable
   prefix-sid index 7
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
   fast-reroute per-prefix tiebreaker node-protecting index 200
   fast-reroute per-prefix tiebreaker srlg-disjoint index 100
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
   fast-reroute per-prefix tiebreaker node-protecting index 200
   fast-reroute per-prefix tiebreaker srlg-disjoint index 100
  !
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 100
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
   fast-reroute per-prefix tiebreaker node-protecting index 200
   fast-reroute per-prefix tiebreaker srlg-disjoint index 100
  !
 !
!
commit
end
