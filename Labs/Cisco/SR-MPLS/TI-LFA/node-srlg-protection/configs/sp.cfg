conf t
interface Loopback0
 ipv4 address 10.0.1.254 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description LINK-SP-RJ
 ipv4 address 10.10.13.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description LINK-SP-MG (protegido)
 ipv4 address 10.10.15.1 255.255.255.252
 no shutdown
!
srlg
 interface GigabitEthernet0/0/0/1
  name ipe-mg-duct
 !
 name ipe-mg-duct value 100
!
segment-routing
 global-block 16000 23999
!
router ospf 1
 router-id 10.0.1.254
 segment-routing mpls
 segment-routing forwarding mpls
 area 0
  interface Loopback0
   passive enable
   prefix-sid index 1
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
   fast-reroute per-prefix tiebreaker node-protecting index 200
   fast-reroute per-prefix tiebreaker srlg-disjoint index 100
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
   fast-reroute per-prefix tiebreaker node-protecting index 200
   fast-reroute per-prefix tiebreaker srlg-disjoint index 100
  !
 !
!
commit
end
