conf t
interface Loopback0
 ipv4 address 10.0.1.253 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description LINK-DF-PR (caminho curto)
 ipv4 address 10.10.26.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description LINK-DF-BA-cost100
 ipv4 address 10.10.27.1 255.255.255.252
 no shutdown
!
segment-routing
 global-block 16000 23999
!
router ospf 1
 router-id 10.0.1.253
 segment-routing mpls
 segment-routing forwarding mpls
 microloop avoidance segment-routing
 area 0
  interface Loopback0
   passive enable
   prefix-sid index 2
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 100
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
  !
 !
!
commit
end
