conf t
interface Loopback0
 ipv4 address 10.0.1.249 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description LINK-PR-SP
 ipv4 address 10.10.16.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description LINK-PR-DF
 ipv4 address 10.10.26.2 255.255.255.252
 no shutdown
!
segment-routing
 global-block 16000 23999
!
router ospf 1
 router-id 10.0.1.249
 segment-routing mpls
 segment-routing forwarding mpls
 microloop avoidance segment-routing
 area 0
  interface Loopback0
   passive enable
   prefix-sid index 6
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa enable
  !
 !
!
commit
end
