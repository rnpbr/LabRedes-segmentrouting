name: cisco-sr-mpls-5node
mgmt:
  network: custom_mgmt                # management network name
  ipv4-subnet: 172.100.100.0/24       # ipv4 range
  ipv6-subnet: 3fff:172:100:100::/80  # ipv6 range (optional)

topology:
  kinds:
    cisco_xrd:
      image: xrd-control-plane:7.10.2

  nodes:
    pe1:
      kind: cisco_xrd
    p1:
      kind: cisco_xrd
    p2:
      kind: cisco_xrd
    p3:
      kind: cisco_xrd
    pe2:
      kind: cisco_xrd

  links:
    - endpoints: ["pe1:Gi0-0-0-0", "p1:Gi0-0-0-0"]
    - endpoints: ["pe1:Gi0-0-0-1", "p2:Gi0-0-0-0"]
    - endpoints: ["p1:Gi0-0-0-1", "pe2:Gi0-0-0-0"]
    - endpoints: ["p2:Gi0-0-0-1", "pe2:Gi0-0-0-1"]
    - endpoints: ["p1:Gi0-0-0-2", "p3:Gi0-0-0-0"]
    - endpoints: ["p3:Gi0-0-0-1", "p2:Gi0-0-0-2"]
