!
hostname p3
!
username clab
 group root-lr
 group cisco-support
 secret clab@123
!
line default
 transport input ssh
!
netconf-yang agent
 ssh
!
interface MgmtEth0/RP0/CPU0/0
!
interface Loopback0
 ipv4 address 10.3.255.3 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description p3-to-dbr-bc1 domain-c normal
 ipv4 address 10.3.0.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description p3-to-p4 domain-c normal
 ipv4 address 10.3.0.4 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description p3-to-pe9 domain-c normal
 ipv4 address 10.3.0.6 255.255.255.254
 no shutdown
!
router ospf 300
 router-id 3.3.3.3
 affinity-map
  red bit-position 10
 !
 segment-routing mpls
 segment-routing sr-prefer
 area 0
  segment-routing mpls
  interface Loopback0
   passive enable
   prefix-sid index 303
   prefix-sid algorithm 128 index 1303
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  !
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  !
 !
 flex-algo 128
  priority 200
  advertise-definition
  affinity exclude-any
   red
  !
 !
!
segment-routing
 global-block 16000 23999
mpls oam
!
ssh server v2
ssh server netconf
end
