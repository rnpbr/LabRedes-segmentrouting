# SR Microloop Avoidance
#
# Deploy:
#   sudo clab deploy -t microloop-avoidance.clab.yml
#
# Cada no le seu arquivo de configuracao em configs/<no>.cfg, ao lado deste
# arquivo. O containerlab entrega o .cfg ao XRd como first-boot.cfg.
#
# Repositorio: https://github.com/rnpbr/LabRedes-segmentrouting.git
#
# Para servir os .cfg direto do GitHub em vez de copiar configs/ para o disco,
# troque o caminho de cada no por uma URL raw:
#   startup-config: https://raw.githubusercontent.com/rnpbr/LabRedes-segmentrouting/main/Labs/Cisco/SR-MPLS/TI-LFA/microloop-avoidance/configs/sp.cfg
# Ref: https://containerlab.dev/manual/config-mgmt/#remote
#
# enforce-startup-config faz todo deploy reaplicar o .cfg, em vez de reusar a
# config gravada por uma execucao anterior.

name: tilfa-microloop-avoidance

mgmt:
  network: tilfa-microloop-mgmt
  ipv4-subnet: 172.20.25.0/24

topology:
  defaults:
    kind: cisco_xrd

  kinds:
    cisco_xrd:
      image: ios-xr/xrd-control-plane:7.10.2
      enforce-startup-config: true
      # para habilitar, o caminho do startup-config deve ser válido. Avaliando import de configs via URL, mas ainda nao definido.

  nodes:
    sp:
      mgmt-ipv4: 172.20.25.11
      startup-config: configs/sp.cfg
    df:
      mgmt-ipv4: 172.20.25.12
      startup-config: configs/df.cfg
    rj:
      mgmt-ipv4: 172.20.25.13
      startup-config: configs/rj.cfg
    mg:
      mgmt-ipv4: 172.20.25.15
      startup-config: configs/mg.cfg
    pr:
      mgmt-ipv4: 172.20.25.16
      startup-config: configs/pr.cfg
    ba:
      mgmt-ipv4: 172.20.25.17
      startup-config: configs/ba.cfg

  links:
    # SP-PR: arco curto, custo 10
    - endpoints: ["sp:Gi0-0-0-1", "pr:Gi0-0-0-0"]
    # PR-DF: arco curto, custo 10 - enlace derrubado no teste
    - endpoints: ["pr:Gi0-0-0-1", "df:Gi0-0-0-0"]
    # DF-BA: custo 100 - ultimo salto do arco longo, coberto por Adj-SID
    - endpoints: ["df:Gi0-0-0-1", "ba:Gi0-0-0-0"]
    # BA-MG: arco longo, custo 10
    - endpoints: ["ba:Gi0-0-0-1", "mg:Gi0-0-0-1"]
    # MG-RJ: arco longo, custo 10
    - endpoints: ["mg:Gi0-0-0-0", "rj:Gi0-0-0-1"]
    # RJ-SP: arco longo, custo 10
    - endpoints: ["rj:Gi0-0-0-0", "sp:Gi0-0-0-0"]
